# 12-Factor: one service per env, config in environment. No code fallback to another env's URL/DB.
# Only PROD lives in the cloud; dev is the local machine (Supabase CLI + php artisan serve). See docs/adr/0009.
# Real values (secrets, DB, PayMongo) live in Render dashboard Env Groups — never committed.
# Runtime: Docker (./Dockerfile, php:8.4-apache).
services:
  - type: web
    name: inea-scents
    env: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    branch: main
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://inea-scents.onrender.com
      - key: FRONTEND_URL
        # 12-Factor: isolated per env — Production Vercel URL for client
        value: https://inea-scents-client.vercel.app
      - key: CORS_SUPPORTS_CREDENTIALS
        value: false
      - key: SANCTUM_STATEFUL_DOMAINS
        value: inea-scents-client.vercel.app
      - key: SESSION_DOMAIN
        value: "" # host-only
      - key: SESSION_SECURE_COOKIE
        value: true
      - key: SESSION_DRIVER
        value: database
      - key: LOG_CHANNEL
        value: stack
      - key: CRON_TOKEN
        generateValue: true
      - key: PAYMONGO_WEBHOOK_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false # Supabase project `inea-scents-db` (christianmeude org)
        # Real values (PayMongo sk/pk live) set via Env Group in dashboard.
databases: []