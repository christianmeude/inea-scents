name: Push API Schema to Mobile

# Suspended: both repos live side-by-side locally, sync manually
# (copy storage/api-docs/api-docs.json -> client api-docs.json).
# Manual trigger only.
on:
  workflow_dispatch:

jobs:
  push-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Backend
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          
      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Generate OpenAPI Spec
        run: php artisan l5-swagger:generate

      - name: Push to Mobile Repo and Create PR
        env:
          GITHUB_TOKEN: ${{ secrets.MOBILE_REPO_PAT }}
        run: |
          # 1. Clone the mobile repository
          git clone https://${GITHUB_TOKEN}@github.com/christianmeude/inea-scents-client.git
          cd inea-scents-client
          
          # 2. Create a unique branch for this update
          BRANCH_NAME="api-sync-$(date +%s)"
          git checkout -b $BRANCH_NAME
          
          # 3. Copy the fresh OpenAPI schema into the mobile repo
          cp ../storage/api-docs/api-docs.json ./api-docs.json
          
          # 4. Commit and push
          git config user.name "Christian Meude"
          git config user.email "christianmeude17@gmail.com"
          git add api-docs.json
          git commit -m "chore: update OpenAPI schema from backend"
          git push origin $BRANCH_NAME
