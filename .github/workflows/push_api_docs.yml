name: Push API Schema to Mobile

on:
  push:
    branches:
      - main
    paths:
      - 'routes/api.php'
      - 'app/Http/Controllers/**'

jobs:
  push-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Backend
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          
      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Generate OpenAPI Spec
        run: php artisan l5-swagger:generate

      - name: Push to Mobile Repo and Create PR
        env:
          GITHUB_TOKEN: ${{ secrets.MOBILE_REPO_PAT }}
        run: |
          # 1. Clone the mobile repository
          git clone https://x-access-token:${GITHUB_TOKEN}@github.com/christianmeude/inea-scents-client.git
          cd inea-scents-client
          
          # 2. Create a unique branch for this update
          BRANCH_NAME="api-sync-$(date +%s)"
          git checkout -b $BRANCH_NAME
          
          # 3. Copy the fresh OpenAPI schema into the mobile repo
          cp ../storage/api-docs/api-docs.json ./api-docs.json
          
          # 4. Commit and push
          git config user.name "Backend Sync Bot"
          git config user.email "bot@backend.local"
          git add api-docs.json
          git commit -m "chore: update OpenAPI schema from backend"
          git push origin $BRANCH_NAME
          
          # 5. Open a Pull Request using the GitHub CLI
          gh pr create \
            --title "Automated API Schema Update" \
            --body "This PR was automatically generated by the Laravel Backend. It contains the latest api-docs.json schema. The mobile CI will now generate the Dart code and run tests." \
            --base main \
            --head $BRANCH_NAME
